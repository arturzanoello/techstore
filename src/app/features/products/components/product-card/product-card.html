<a (click)="addProductToCart()" class="product">
  <img class="image" [ngSrc]="product().imageUrl" [alt]="product().name" width="250" height="250">
  <h4 class="name" [title]="product().name">{{ product().name }}</h4>
  <span class="price">{{ product().price | currency:'BRL':'symbol':'1.2-2' }}</span>
</a>
